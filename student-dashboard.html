<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="student-detail-body">
    <nav class="student-topbar">
        <div>
            <span class="student-topbar-title">Student Dashboard</span>
            <small>Profile, fees, payments, and academic timeline</small>
        </div>
        <button class="btn btn-danger btn-sm" id="studentLogoutBtn" type="button">
            <i class="bi bi-box-arrow-left me-1"></i>Logout
        </button>
    </nav>

    <main class="student-detail-layout">
        <aside class="student-summary-card">
            <div class="student-avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <h1 id="studentName"></h1>

            <dl class="student-summary-list" id="studentSummaryList"></dl>
        </aside>

        <section class="student-detail-panel">
            <ul class="nav student-tabs" id="studentTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profileTab" type="button" role="tab">Profile</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="fees-tab" data-bs-toggle="tab" data-bs-target="#feesTab" type="button" role="tab">Fees</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="payments-tab" data-bs-toggle="tab" data-bs-target="#paymentsTab" type="button" role="tab">Payments</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#attendanceTab" type="button" role="tab">Attendance</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="timeline-tab" data-bs-toggle="tab" data-bs-target="#timelineTab" type="button" role="tab">Timeline</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="profileTab" role="tabpanel" aria-labelledby="profile-tab">
                    <div class="student-section" id="basicInfoSection">
                        <h2>Basic Info</h2>
                        <div class="student-info-grid" id="basicInfoGrid"></div>
                    </div>

                    <div class="student-section" id="addressSection">
                        <h2>Address</h2>
                        <div class="student-info-grid two-column" id="addressGrid"></div>
                    </div>

                    <div class="student-section guardian-section" id="parentDetailsSection">
                        <h2>Parent Details</h2>
                        <div class="guardian-content">
                            <div class="student-info-grid two-column" id="parentDetailsGrid"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="feesTab" role="tabpanel" aria-labelledby="fees-tab">
                    <div class="student-section">
                        <h2>Fee Details</h2>
                        <div class="student-info-grid" id="feeDetailsGrid"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="paymentsTab" role="tabpanel" aria-labelledby="payments-tab">
                    <div class="student-section">
                        <h2>Payments</h2>
                        <div class="student-info-grid" id="paymentSummaryGrid"></div>
                    </div>

                    <div class="student-section">
                        <h2>Pay Now</h2>
                        <div class="row g-3 px-3 pb-3">
                            <div class="col-md-4">
                                <input type="number" class="form-control" id="paymentAmount" placeholder="Amount" min="1">
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="paymentMethod">
                                    <option value="UPI">UPI</option>
                                    <option value="Card">Card</option>
                                    <option value="Cash">Cash</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100" id="payNowBtn" type="button">Pay Now</button>
                            </div>
                        </div>
                    </div>

                    <div class="student-section">
                        <h2>Payment History</h2>
                        <div class="table-responsive px-3 pb-3">
                            <table class="table align-middle custom-table mb-0">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Method</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentHistory"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="attendanceTab" role="tabpanel" aria-labelledby="attendance-tab">
                    <div class="student-section">
                        <h2>My Attendance</h2>
                        <div class="attendance-summary student-attendance-summary" id="studentAttendanceSummary"></div>
                        <div class="table-responsive px-3 pb-3">
                            <table class="table align-middle custom-table mb-0">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="studentAttendanceHistory"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="timelineTab" role="tabpanel" aria-labelledby="timeline-tab">
                    <div class="student-section">
                        <h2>Timeline</h2>
                        <div class="student-timeline" id="studentTimeline"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = "http://localhost:5000/api";
        const session = JSON.parse(localStorage.getItem("erp_session") || "{}");
        const token = localStorage.getItem("erp_token");
        let student = {};
        let studentPayments = [];
        let paidAmount = 0;
        let totalAmount = 0;
        let attendanceRows = [];

        if (!hasActiveStudentSession()) {
            redirectToLogin();
        } else {
            applyStudentData();
            loadStudentDashboardData();
        }

        window.addEventListener("pageshow", () => {
            if (!hasActiveStudentSession()) {
                redirectToLogin();
            }
        });

        document.getElementById("studentLogoutBtn").addEventListener("click", () => {
            localStorage.removeItem("erp_token");
            localStorage.removeItem("erp_session");
            redirectToLogin();
        });

        document.getElementById("payNowBtn").addEventListener("click", async () => {
            const amount = Number(document.getElementById("paymentAmount").value);
            const method = document.getElementById("paymentMethod").value;

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount");
                return;
            }

            const payment = {
                student: student.name,
                studentId: student._id || student.id,
                course: student.course,
                amount,
                method,
                date: new Date().toISOString().slice(0, 10),
                status: "Paid"
            };

            try {
                if (token) {
                    await apiRequest("/payments", {
                        method: "POST",
                        body: JSON.stringify(payment)
                    });
                    await loadFeeSummary();
                } else {
                    const payments = JSON.parse(localStorage.getItem("erp_payments") || "[]");
                    payments.unshift({
                        ...payment,
                        id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`
                    });
                    localStorage.setItem("erp_payments", JSON.stringify(payments));
                    loadLocalFeeSummary();
                }

                document.getElementById("paymentAmount").value = "";
                alert("Payment Successful");
            } catch (error) {
                alert(error.message || "Payment failed");
            }
        });

        function formatDate(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleDateString("en-GB").replace(/\//g, "-");
        }

        function formatCurrency(value) {
            return `Rs. ${Number(value || 0).toLocaleString("en-IN")}`;
        }

        function hasValue(value) {
            return value !== undefined && value !== null && String(value).trim() !== "";
        }

        function hasActiveStudentSession() {
            const freshSession = JSON.parse(localStorage.getItem("erp_session") || "{}");
            return Boolean(localStorage.getItem("erp_token") && (freshSession.id || freshSession._id || freshSession.email));
        }

        function redirectToLogin() {
            window.location.replace("index.html");
        }

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...(options.headers || {})
                }
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || "Request failed");
            }

            return data;
        }

        async function loadStudentDashboardData() {
            if (!session.id && !session._id && !session.email) {
                window.location.href = "index.html";
                return;
            }

            try {
                student = await fetchLoggedInStudent();
                await Promise.all([
                    loadFeeSummary(),
                    loadStudentAttendance()
                ]);
                applyStudentData();
            } catch (error) {
                console.error(error);
                student = findLocalStudent() || {};
                loadLocalFeeSummary();
                loadLocalStudentAttendance();
                applyStudentData();
            }
        }

        async function fetchLoggedInStudent() {
            const loggedInUserId = session.id || session._id;
            const sessionEmail = String(session.email || "").toLowerCase();
            let apiStudent = null;

            if (loggedInUserId && token) {
                try {
                    apiStudent = await apiRequest(`/students/${loggedInUserId}`);
                } catch {
                    apiStudent = null;
                }
            }

            if (!apiStudent && token) {
                const students = await apiRequest("/students");
                apiStudent = students.find((entry) => {
                    const studentId = entry._id || entry.id;
                    const studentEmail = String(entry.email || "").toLowerCase();
                    return String(studentId) === String(loggedInUserId) || studentEmail === sessionEmail;
                });
            }

            return mergeStudentExtraDetails(apiStudent || findLocalStudent() || {});
        }

        function findLocalStudent() {
            const loggedInUserId = session.id || session._id;
            const sessionEmail = String(session.email || "").toLowerCase();
            const students = JSON.parse(localStorage.getItem("erp_students") || "[]");

            return students.find((entry) => {
                const studentId = entry._id || entry.id;
                const studentEmail = String(entry.email || "").toLowerCase();
                return String(studentId) === String(loggedInUserId) || studentEmail === sessionEmail;
            });
        }

        function mergeStudentExtraDetails(record) {
            const extras = JSON.parse(localStorage.getItem("erp_student_extra_details") || "{}");
            const studentId = record?._id || record?.id;
            const email = String(record?.email || session.email || "").toLowerCase();
            const extra = {
                ...(extras[email] || {}),
                ...(extras[studentId] || {})
            };

            return {
                ...record,
                ...extra,
                fatherName: record.fatherName || extra.fatherName,
                motherName: record.motherName || extra.motherName,
                dateOfBirth: record.dateOfBirth || extra.dateOfBirth,
                category: record.category || extra.category,
                duration: record.duration || extra.duration,
                address: record.address || extra.address
            };
        }

        async function loadFeeSummary() {
            if (!token) {
                loadLocalFeeSummary();
                return;
            }

            const summary = await apiRequest(`/payments/summary?student=${encodeURIComponent(student.name || "")}`);
            totalAmount = Number(summary.totalFees || 0);
            paidAmount = Number(summary.paidAmount || 0);
            studentPayments = summary.payments || [];
        }

        function loadLocalFeeSummary() {
            const payments = JSON.parse(localStorage.getItem("erp_payments") || "[]");
            const studentId = student._id || student.id;
            studentPayments = payments.filter((payment) => {
                const paymentStudentId = payment.studentId || payment.student?._id || payment.student?.id;
                return String(paymentStudentId || "") === String(studentId || "") || payment.student === student.name;
            });
            paidAmount = studentPayments.reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
            totalAmount = Number(student.totalFees || student.fee || student.courseFee || paidAmount || 0);
        }

        async function loadStudentAttendance() {
            if (!token) {
                loadLocalStudentAttendance();
                return;
            }

            const sheets = await apiRequest("/attendance");
            const studentId = student._id || student.id;
            attendanceRows = sheets
                .map((sheet) => {
                    const record = (sheet.records || []).find((entry) => {
                        const recordStudentId = entry.student?._id || entry.student?.id || entry.student;
                        return String(recordStudentId) === String(studentId);
                    });

                    return record ? {
                        date: sheet.date,
                        status: record.status || "Pending"
                    } : null;
                })
                .filter(Boolean)
                .sort((rowA, rowB) => new Date(rowB.date) - new Date(rowA.date));
        }

        function loadLocalStudentAttendance() {
            const attendance = JSON.parse(localStorage.getItem("erp_attendance") || "{}");
            const studentId = student._id || student.id;
            attendanceRows = Object.entries(attendance)
                .map(([date, dailyAttendance]) => ({
                    date,
                    status: dailyAttendance?.[studentId]
                }))
                .filter((entry) => hasValue(entry.status))
                .sort((rowA, rowB) => new Date(rowB.date) - new Date(rowA.date));
        }

        function applyStudentData() {
            const visibleName = student.name || session.name || "";
            document.getElementById("studentName").textContent = visibleName;

            renderSummaryRows([
                ["Course", student.course],
                ["Phone Number", student.phone],
                ["Duration", student.duration],
                ["Joining Date", formatDate(student.joinDate)],
                ["Status", student.status]
            ]);

            renderSection("basicInfoSection", "basicInfoGrid", [
                ["Student Name", visibleName],
                ["Date of Birth", formatDate(student.dateOfBirth)],
                ["Category", student.category],
                ["Phone Number", student.phone],
                ["Course", student.course],
                ["Duration", student.duration],
                ["Joining Date", formatDate(student.joinDate)],
                ["Status", student.status]
            ]);

            renderSection("addressSection", "addressGrid", [
                ["Address", student.address]
            ]);

            renderSection("parentDetailsSection", "parentDetailsGrid", [
                ["Father Name", student.fatherName],
                ["Mother Name", student.motherName]
            ]);

            renderFinancialSections();
            renderPaymentHistory();
            renderStudentAttendance();
            renderTimeline();
        }

        function renderSummaryRows(rows) {
            document.getElementById("studentSummaryList").innerHTML = rows
                .filter(([, value]) => hasValue(value))
                .map(([label, value]) => `
                    <div>
                        <dt>${label}</dt>
                        <dd>${escapeHtml(value)}</dd>
                    </div>
                `).join("");
        }

        function renderSection(sectionId, gridId, rows) {
            const visibleRows = rows.filter(([, value]) => hasValue(value));
            const section = document.getElementById(sectionId);
            const grid = document.getElementById(gridId);

            section.hidden = !visibleRows.length;
            grid.innerHTML = visibleRows.map(([label, value]) => `
                <span>${label}</span>
                <strong>${escapeHtml(value)}</strong>
            `).join("");
        }

        function renderFinancialSections() {
            const pendingAmount = Math.max(totalAmount - paidAmount, 0);
            const deadline = formatDate(getFeeDeadline(student.joinDate, student.duration));
            const feeRows = [
                ["Total Fees", formatCurrency(totalAmount)],
                ["Paid", formatCurrency(paidAmount)],
                ["Pending", formatCurrency(pendingAmount)],
                ["Deadline", deadline]
            ];
            const paymentRows = [
                ["Total Fees", formatCurrency(totalAmount)],
                ["Paid Amount", formatCurrency(paidAmount)],
                ["Pending Amount", formatCurrency(pendingAmount)],
                ["Payment Deadline", deadline]
            ];

            renderGridRows("feeDetailsGrid", feeRows);
            renderGridRows("paymentSummaryGrid", paymentRows);
        }

        function renderGridRows(gridId, rows) {
            document.getElementById(gridId).innerHTML = rows
                .filter(([, value]) => hasValue(value))
                .map(([label, value]) => `
                    <span>${label}</span>
                    <strong>${escapeHtml(value)}</strong>
                `).join("");
        }

        function getFeeDeadline(joinDate, duration) {
            if (!joinDate) return "";

            const deadline = new Date(joinDate);
            if (Number.isNaN(deadline.getTime())) return "";

            const normalizedDuration = String(duration || "").toLowerCase();
            if (normalizedDuration.includes("45")) {
                deadline.setDate(deadline.getDate() + 45);
            } else if (normalizedDuration.includes("3")) {
                deadline.setMonth(deadline.getMonth() + 3);
            } else if (normalizedDuration.includes("6")) {
                deadline.setMonth(deadline.getMonth() + 6);
            } else {
                deadline.setMonth(deadline.getMonth() + 1);
            }

            return deadline.toISOString();
        }

        function renderPaymentHistory() {
            document.getElementById("paymentHistory").innerHTML = studentPayments.length
                ? studentPayments
                    .slice()
                    .sort((paymentA, paymentB) => new Date(paymentB.date) - new Date(paymentA.date))
                    .map((payment) => `
                        <tr>
                            <td>${escapeHtml(formatDate(payment.date))}</td>
                            <td>${escapeHtml(formatCurrency(payment.amount))}</td>
                            <td>${escapeHtml(payment.method || "Payment")}</td>
                            <td>${statusBadge(payment.status || "Paid")}</td>
                        </tr>
                    `).join("")
                : `
                    <tr>
                        <td colspan="4">
                            <div class="empty-state">
                                <i class="bi bi-credit-card"></i>
                                No payment history available.
                            </div>
                        </td>
                    </tr>
                `;
        }

        function renderStudentAttendance() {
            const presentCount = attendanceRows.filter((entry) => entry.status === "Present").length;
            const absentCount = attendanceRows.filter((entry) => entry.status === "Absent").length;
            const pendingCount = attendanceRows.filter((entry) => entry.status === "Pending").length;

            document.getElementById("studentAttendanceSummary").innerHTML = `
                <div class="attendance-summary-card">
                    <h3>${attendanceRows.length}</h3>
                    <p>Total saved days</p>
                </div>
                <div class="attendance-summary-card">
                    <h3>${presentCount}</h3>
                    <p>Present days</p>
                </div>
                <div class="attendance-summary-card">
                    <h3>${absentCount}</h3>
                    <p>Absent days</p>
                </div>
                <div class="attendance-summary-card">
                    <h3>${pendingCount}</h3>
                    <p>Pending entries</p>
                </div>
            `;

            document.getElementById("studentAttendanceHistory").innerHTML = attendanceRows.length
                ? attendanceRows.map((entry) => `
                    <tr>
                        <td>${escapeHtml(formatDate(entry.date))}</td>
                        <td>${statusBadge(entry.status)}</td>
                    </tr>
                `).join("")
                : `
                    <tr>
                        <td colspan="2">
                            <div class="empty-state">
                                <i class="bi bi-calendar-x"></i>
                                No attendance has been submitted yet.
                            </div>
                        </td>
                    </tr>
                `;
        }

        function renderTimeline() {
            const rows = [
                ["Admission Created", formatDate(student.joinDate)],
                ["Fees Updated", studentPayments[0]?.date ? formatDate(studentPayments[0].date) : ""],
                ["Profile Reviewed", "Current session"]
            ].filter(([, value]) => hasValue(value));

            document.getElementById("studentTimeline").innerHTML = rows.map(([label, value]) => `
                <div>
                    <strong>${escapeHtml(label)}</strong>
                    <span>${escapeHtml(value)}</span>
                </div>
            `).join("");
        }

        function statusBadge(status) {
            const normalized = String(status || "").toLowerCase();
            const className = {
                active: "status-active",
                present: "status-present",
                absent: "status-absent",
                pending: "status-pending",
                paid: "status-paid",
                success: "status-paid",
                partial: "status-partial",
                completed: "status-completed",
                failed: "status-absent"
            }[normalized] || "status-pending";

            return `<span class="status-badge ${className}">${escapeHtml(status)}</span>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>

</html>
