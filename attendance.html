<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="erp-app" data-page="attendance" data-page-title="Attendance">
    <div class="erp-shell">
        <aside id="appSidebar"></aside>
        <div class="erp-main">
            <header id="appNavbar"></header>
            <main class="content-area">
                <section class="page-head with-action">
                    <div>
                        <span class="section-kicker">Daily Tracking</span>
                        <h1 class="page-title">Attendance System</h1>
                        <p class="text-secondary mb-0">Update present or absent status and keep it persisted by date.</p>
                    </div>
                    <div class="date-filter">
                        <label class="form-label mb-1" for="attendanceDate">Attendance Date</label>
                        <input class="form-control" id="attendanceDate" type="date">
                    </div>
                </section>

                <section class="panel-card">
                    <div class="attendance-summary" id="attendanceSummary"></div>
                    <div class="table-responsive">
                        <table class="table align-middle custom-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Course</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTableBody"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
