<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="erp-app" data-page="courses" data-page-title="Courses">
    <div class="erp-shell">
        <aside id="appSidebar"></aside>
        <div class="erp-main">
            <header id="appNavbar"></header>
            <main class="content-area">
                <section class="page-head with-action">
                    <div>
                        <span class="section-kicker">Course Catalog</span>
                        <h1 class="page-title">Course Management</h1>
                        <p class="text-secondary mb-0">Maintain institute programs, duration, and fee structures.</p>
                    </div>
                    <button class="btn btn-primary primary-action" data-bs-toggle="modal" data-bs-target="#courseModal">
                        <i class="bi bi-plus-circle me-2"></i>Add Course
                    </button>
                </section>

                <section class="row g-4" id="coursesGrid"></section>
            </main>
        </div>
    </div>

    <div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title fs-5" id="courseModalLabel">Add Course</h2>
                        <p class="text-secondary mb-0 small">Configure a new institute program.</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="courseForm">
                    <div class="modal-body">
                        <input type="hidden" id="courseId">
                        <div class="mb-3">
                            <label class="form-label" for="courseName">Course Name</label>
                            <input class="form-control" id="courseName" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="courseDuration">Duration</label>
                                <input class="form-control" id="courseDuration" placeholder="6 Months" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="courseFee">Fees</label>
                                <input class="form-control" id="courseFee" type="number" min="0" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label" for="courseDescription">Description</label>
                            <textarea class="form-control" id="courseDescription" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary primary-action">Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
