<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="erp-app" data-page="profile" data-page-title="Profile">
    <div class="erp-shell">
        <aside id="appSidebar"></aside>
        <div class="erp-main">
            <header id="appNavbar"></header>
            <main class="content-area">
                <section class="page-head">
                    <div>
                        <span class="section-kicker">Admin Workspace</span>
                        <h1 class="page-title">Profile Settings</h1>
                        <p class="text-secondary mb-0">Manage administrator identity and institute contact details.</p>
                    </div>
                </section>

                <section class="row g-4">
                    <div class="col-xl-4">
                        <div class="panel-card profile-card">
                            <img class="profile-avatar" src="./assets/images/photo.jpg" alt="Admin profile">
                            <h2 id="profileNameCard">Admin User</h2>
                            <p id="profileRoleCard" class="text-secondary mb-1">ERP Administrator</p>
                            <p id="profileInstituteCard" class="small text-secondary mb-0">NextGen IT Training Institute</p>
                        </div>
                    </div>
                    <div class="col-xl-8">
                        <div class="panel-card">
                            <div class="panel-header">
                                <div>
                                    <h2>Edit Profile</h2>
                                    <p>Update saved administrator details.</p>
                                </div>
                            </div>
                            <form id="profileForm" class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="profileName">Full Name</label>
                                    <input class="form-control" id="profileName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="profileRole">Role</label>
                                    <input class="form-control" id="profileRole" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="profileEmail">Email</label>
                                    <input class="form-control" id="profileEmail" type="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="profilePhone">Phone</label>
                                    <input class="form-control" id="profilePhone" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="profileInstitute">Institute</label>
                                    <input class="form-control" id="profileInstitute" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="profileLocation">Location</label>
                                    <input class="form-control" id="profileLocation" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="profileBio">Bio</label>
                                    <textarea class="form-control" id="profileBio" rows="4" required></textarea>
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-primary primary-action" type="submit">
                                        <i class="bi bi-save me-2"></i>Update Profile
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
